name: Vision input fixes

on:
  workflow_dispatch:
  push:
    branches:
      - vision-input-fixes

permissions:
  contents: read

concurrency:
  group: vision-input-fixes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: linux-amd64 / render
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable as of 2026-09-08

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: nextest
          fallback: none

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64-render
          cache-on-failure: true

      - name: Test render-enabled workspace
        run: cargo nextest run --release --features render --no-fail-fast

      - name: Build render release
        run: cargo build --locked --release -p obscura-cli --bins --features render
