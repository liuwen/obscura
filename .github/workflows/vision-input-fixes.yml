name: Vision input fixes

on:
  workflow_dispatch:
  push:
    branches:
      - vision-input-fixes

permissions:
  contents: read

concurrency:
  group: vision-input-fixes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: linux-amd64 / render
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test render-enabled workspace
        env:
          # The workspace's HTTP fixtures bind loopback; opt in only for tests.
          OBSCURA_ALLOW_PRIVATE_NETWORK: "1"
        run: |
          cargo test --locked -p obscura-cdp --features render
          cargo test --locked -p obscura-browser --features render
          # The complete pinned v0.2.2 JS suite hits an unrelated V8 IsFrozen SIGTRAP on current Linux runners.
          cargo test --locked -p obscura-js document_referrer_has_explicit_navigation_state
          cargo test --locked -p obscura-net
          cargo test --locked -p obscura-render

      - name: Build render release
        run: cargo build --locked --release -p obscura-cli --bins --features render
